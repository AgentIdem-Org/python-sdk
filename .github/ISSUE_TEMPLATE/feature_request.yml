name: Feature request
description: Suggest an improvement or new AgentIdem capability.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement to AgentIdem.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve?
      placeholder: Describe the problem or limitation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like AgentIdem to do?
      placeholder: Describe the behavior or API you have in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Are there other approaches or workarounds?

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, links, or anything else that may help.